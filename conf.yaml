---
service:
  listenPort: :9634
  aerospikeAddr: 127.0.0.1
  aerospikePort: 3000
  skipNodeCheck: false
  failOnClusterChange: true
  frequencySecs: 25
  verbose: false
  username: admin
  password: admin

monitor:
  - namespace: local-test
    set: robert
    staticBucketList:
      - 1d
      - 2d
      - 3d
      - 6d
      - 7d
      - 10d
    recordCount: 1000
    scanPercent: 1
    exportPercentages: true
    exportRecordCount: true
    reportCount: 300000
    recordModulo: 1000
    scanPriority: 3
    recordsPerSecond: 1000
    scanTotalTimeout: 20m
    scanSocketTimeout: 20m
    policyTotalTimeout: 20m
    policySocketTimeout: 20m
    kbyteHistogramResolution: 0.333
    kbyteHistogram:
      deviceSize: true
      memorySize: true
