---
# Auto-discovery mode with tuned defaults (no per-set overrides).
#
# The exporter asks Aerospike which namespaces/sets exist, reads each set's
# default-ttl and live TTL histogram, and fits the TTL buckets automatically.
# discoveryDefaults supplies the scan/perf/feature settings applied to every
# discovered set. Fields omitted here fall back to built-in defaults
# (see conf.yaml for the full annotated reference).
service:
  autoDiscover: true
  frequencySecs: 60
  discoveryIntervalSecs: 300 # re-discover/re-fit every 5m (default: 3h)
  discoveryRangePaddingPct: 25 # headroom above observed max TTL

  discoveryDefaults:
    scanPercent: 1.0
    recordsPerSecond: 100
    scanTotalTimeout: 20m # default: 5m — raised for large sets
    scanSocketTimeout: 20m
    policyTotalTimeout: 20m
    policySocketTimeout: 20m
    ttlBytesHistogramEnabled: true
    sizeHistogramEnabled: true
    ttlBuckets:
      mode: auto
      scale: linear # default; set exponential for heavily skewed TTLs
    sizeBuckets:
      mode: exponential
      min: 1
      max: 8389000 # 8 MiB — max aerospike record size (7.0+)
      count: 10
    # quantileTargets: [0.20, 0.50, 0.90, 0.99]  # blanket default (built-in)
