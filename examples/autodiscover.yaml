---
# Auto-discovery mode (autoDiscover: true), no overrides.
#
# The exporter asks Aerospike which namespaces/sets exist, reads each set's
# default-ttl and live TTL histogram, and fits the TTL buckets automatically —
# no monitor entries needed. discoveryDefaults supplies the scan/perf/feature
# settings applied to every discovered set.
service:
  listenPort: :9634
  aerospikeAddr: 127.0.0.1
  aerospikePort: 3000
  skipNodeCheck: false
  frequencySecs: 60
  verbose: false

  autoDiscover: true
  discoveryIntervalSecs: 300 # re-discover/re-fit every 5m
  discoveryBucketCount: 10 # number of TTL bins per set
  discoveryRangePaddingPct: 25 # headroom above observed max TTL (keeps drift out of +Inf)

  discoveryDefaults:
    recordCount: -1
    scanPercent: 1.0
    reportCount: 300000
    scanTotalTimeout: 20m
    scanSocketTimeout: 20m
    policyTotalTimeout: 20m
    policySocketTimeout: 20m
    recordsPerSecond: 100
    kbyteHistogramEnabled: true
    sizeHistogramEnabled: true
    ttlBuckets:
      mode: auto
      scale: linear # default; set exponential for heavily skewed TTLs
    sizeBuckets:
      mode: exponential
      min: 1
      max: 8389000 # 8 MiB — max aerospike record size (7.0+)
      count: 10
    # quantileTargets: exact quantile percentiles to compute for TTL and size
    # distributions. Values must be in (0, 1). Defaults to [0.20, 0.50, 0.90, 0.99].
    # quantileTargets: [0.20, 0.50, 0.90, 0.99]
