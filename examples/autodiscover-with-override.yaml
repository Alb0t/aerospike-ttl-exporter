---
# Auto-discovery with per-set overrides — "kitchen sink" showing every field.
#
# Discovery handles every set automatically. Each monitor entry below matches a
# discovered set by namespace+set and overrides ONLY the fields it sets
# (field-by-field). Bucket blocks (ttlBuckets/sizeBuckets) replace wholesale —
# a present block entirely supplants the discovered/default one.
service:
  listenPort: :9634              # default
  aerospikeAddr: 127.0.0.1      # default
  aerospikePort: 3000            # default
  skipNodeCheck: false           # default; true = skip local-node check (testing only)
  frequencySecs: 60              # scan interval (default: 300)
  verbose: false                 # default

  autoDiscover: true
  discoveryIntervalSecs: 300     # re-discover interval (default: 10800)
  discoveryBucketCount: 10       # TTL bins per set (default)
  discoveryRangePaddingPct: 25   # headroom above observed max TTL; 0 = none
  discoveryOutlierPct: 1         # ignore buckets < 1% of total; 0 = no filtering

  discoveryDefaults:
    recordCount: -1              # -1 = no cap (default when omitted)
    scanPercent: 1.0             # sample ~1% of records
    reportCount: 300000          # verbose progress every N records
    scanTotalTimeout: 20m        # default: 5m
    scanSocketTimeout: 20m       # default: 5m
    policyTotalTimeout: 20m      # default: 5m
    policySocketTimeout: 20m     # default: 5m
    recordsPerSecond: 100        # throttle; 0 = unlimited
    ttlCountsHistogramEnabled: true   # expiry_count_hist (default: true)
    ttlBytesHistogramEnabled: true    # expiry_bytes_hist
    sizeHistogramEnabled: true        # size_bytes_hist
    ttlBuckets:
      mode: auto
      scale: linear              # linear|exponential; exponential for skewed TTLs
    sizeBuckets:
      mode: exponential
      min: 1
      max: 8389000               # 8 MiB — max aerospike record size (7.0+)
      count: 10
    quantileTargets: [0.20, 0.50, 0.90, 0.99]  # blanket default for all dimensions
    # Per-dimension overrides (fall back to quantileTargets if omitted):
    # ttlCountsQuantileTargets: [0.20, 0.50, 0.90, 0.99]
    # sizeQuantileTargets: [0.20, 0.50, 0.90, 0.99]
    # ttlBytesQuantileTargets: [0.20, 0.50, 0.90, 0.99]

monitor:
  # metrics:timeseries is heavily skewed — most records expire soon with a long
  # tail. Keep auto-fitting the range, but switch to exponential spacing for
  # sharper low-TTL resolution, and sample this set harder than the default.
  - namespace: metrics
    set: timeseries
    scanPercent: 5.0
    ttlBuckets:
      mode: auto
      scale: exponential

  # audit:log has a fixed contractual retention — pin explicit static buckets
  # instead of auto-fitting, and skip the size histogram for this set.
  - namespace: audit
    set: log
    sizeHistogramEnabled: false
    ttlCountsQuantileTargets: [0.50, 0.99]
    sizeQuantileTargets: []              # disable size quantiles for this set
    ttlBytesQuantileTargets: [0.50, 0.99]
    ttlBuckets:
      mode: static
      static: [30d, 90d, 180d, 270d, 365d]
